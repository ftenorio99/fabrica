# CI do PR, modelo da fábrica (SPEC-128, ADR 0019).
#
# Roda make lint e make test no job "verificacao" e make e2e (Playwright) no
# job "e2e", em paralelo, num runner descartável a cada PR e a cada push na main.
#
# Contrato do make e2e: o alvo é autossuficiente. Ele sobe o banco (pelo Docker
# Compose do projeto, em geral com o alvo db-up como dependência) e o app (pelo
# webServer do Playwright ou pelo Compose) e roda o Playwright, igual à etapa
# local da fábrica (ADR 0011). O CI só o chama. Sem o alvo e2e no Makefile, o
# job "e2e" termina verde sem rodar nada.
#
# Valores de teste: o modelo não usa nenhum secret. Sem .env, o .env.example
# é copiado para .env. Os valores dele são os locais de desenvolvimento, sem
# valor real, e precisam bastar para o make test e o make e2e.
#
# Esta cópia é do projeto: edite-a à vontade (outros navegadores, outra stack,
# variáveis próprias). O /fabrica:setup nunca a sobrescreve.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancela execuções antigas do mesmo PR (ou branch) quando chega um push novo.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verificacao:
    runs-on: ubuntu-latest
    steps:
      # Ações fixadas pelo SHA do commit; o comentário indica a versão.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A versão do pnpm vem do campo packageManager do package.json.
      - if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - if: hashFiles('.nvmrc') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Instala as dependências
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          elif [ -f Makefile ] && grep -q '^install:' Makefile; then
            make install
          else
            echo "ci: sem lockfile nem alvo install; dependências não instaladas"
          fi

      - name: Cria o .env de teste
        run: |
          if [ ! -e .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - run: make lint

      - run: make test

  # Testes de ponta a ponta (Playwright), em paralelo à verificação.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - if: hashFiles('.nvmrc') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Instala as dependências
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          elif [ -f Makefile ] && grep -q '^install:' Makefile; then
            make install
          else
            echo "ci: sem lockfile nem alvo install; dependências não instaladas"
          fi

      - name: Cria o .env de teste
        run: |
          if [ ! -e .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      # Sem o alvo e2e no Makefile, os passos seguintes são pulados e o job fica verde.
      - name: Confere o alvo e2e
        id: alvo
        run: |
          if [ -f Makefile ] && grep -q '^e2e:' Makefile; then
            echo "tem=sim" >> "$GITHUB_OUTPUT"
          else
            echo "ci: o Makefile não tem o alvo e2e; nada a rodar"
            echo "tem=nao" >> "$GITHUB_OUTPUT"
          fi

      # A chave do cache dos navegadores é a versão do Playwright resolvida.
      - name: Lê a versão do Playwright
        id: playwright-version
        if: steps.alvo.outputs.tem == 'sim'
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - id: playwright-cache
        if: steps.alvo.outputs.tem == 'sim'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Sem cache, baixa o Chromium e as bibliotecas do sistema; com cache, só as bibliotecas.
      - name: Instala o Chromium do Playwright
        if: steps.alvo.outputs.tem == 'sim' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm exec playwright install --with-deps chromium; else npx playwright install --with-deps chromium; fi

      - name: Instala as bibliotecas do sistema do Playwright
        if: steps.alvo.outputs.tem == 'sim' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm exec playwright install-deps chromium; else npx playwright install-deps chromium; fi

      - name: Roda o make e2e
        if: steps.alvo.outputs.tem == 'sim'
        run: make e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
