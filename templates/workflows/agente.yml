# Dispatcher da fábrica (SPEC-105, SPEC-106, ADR 0015 e 0016): quando a label
# `agente` é aplicada numa issue aberta, roda o /fabrica:triagem no runner, com
# o plugin instalado e o agente isolado (sem rede direta, sem os tokens em
# claro). Copie este arquivo para .github/workflows/agente.yml do projeto.
# Secrets do repositório:
#   CLAUDE_CODE_OAUTH_TOKEN  claude setup-token
#   FABRICA_GH_TOKEN         fine-grained, só neste repositório (as escritas do job)
#   FABRICA_PLUGIN_TOKEN     fine-grained, só contents: read no ftenorio99/fabrica
# Guia: docs/guias/dispatcher.md do plugin.
name: agente

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: fabrica-${{ github.event.issue.number }}-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  etapa:
    if: github.event.label.name == 'agente' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instala o Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Instala o plugin da fábrica
        id: plugin
        env:
          GH_TOKEN: ${{ secrets.FABRICA_PLUGIN_TOKEN }}
          CLAUDE_CODE_PLUGIN_PREFER_HTTPS: "1"
        run: |
          gh auth setup-git
          claude plugin marketplace add ftenorio99/fabrica
          claude plugin install fabrica@fabrica
          path="$(claude plugin list --json | python3 -I -c 'import json, sys; print(next(p["installPath"] for p in json.load(sys.stdin) if p.get("id") == "fabrica@fabrica"))')"
          test -f "$path/scripts/dispatch.sh"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Instala o mitmproxy
        run: |
          sudo python3 -m venv /opt/fabrica-mitm
          sudo /opt/fabrica-mitm/bin/pip install --quiet mitmproxy==12.3.1
          /opt/fabrica-mitm/bin/mitmdump --version

      - name: Prepara o isolamento
        env:
          FABRICA_PLUGIN_DIR: ${{ steps.plugin.outputs.path }}
        run: sudo bash "$FABRICA_PLUGIN_DIR/scripts/job-isolation.sh" prepare "$FABRICA_PLUGIN_DIR" "$GITHUB_WORKSPACE"

      - name: Trava a rede e os segredos
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FABRICA_GH_TOKEN: ${{ secrets.FABRICA_GH_TOKEN }}
          FABRICA_PLUGIN_DIR: ${{ steps.plugin.outputs.path }}
        run: sudo --preserve-env=CLAUDE_CODE_OAUTH_TOKEN,FABRICA_GH_TOKEN bash "$FABRICA_PLUGIN_DIR/scripts/job-isolation.sh" lock

      - name: Roda a etapa
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.FABRICA_GH_TOKEN }}
          FABRICA_CLAUDE_BIN: ${{ steps.plugin.outputs.path }}/scripts/run-as-agent.sh
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          FABRICA_PLUGIN_DIR: ${{ steps.plugin.outputs.path }}
        run: bash "$FABRICA_PLUGIN_DIR/scripts/dispatch.sh" run "$ISSUE_NUMBER"

      - name: Desmarca a issue
        if: always() && steps.plugin.outputs.path != ''
        env:
          GH_TOKEN: ${{ secrets.FABRICA_GH_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          FABRICA_PLUGIN_DIR: ${{ steps.plugin.outputs.path }}
        run: bash "$FABRICA_PLUGIN_DIR/scripts/dispatch.sh" unmark "$ISSUE_NUMBER"

      - name: Publica a falha
        if: failure() && steps.plugin.outputs.path != ''
        env:
          GH_TOKEN: ${{ secrets.FABRICA_GH_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          FABRICA_PLUGIN_DIR: ${{ steps.plugin.outputs.path }}
        run: bash "$FABRICA_PLUGIN_DIR/scripts/dispatch.sh" fail "$ISSUE_NUMBER"

      # Reserva para quando o plugin não chegou a ser instalado: o dispatch.sh
      # vem do plugin, então o comentário sai daqui, com texto fixo.
      - name: Publica a falha da instalação
        if: failure() && steps.plugin.outputs.path == ''
        env:
          GH_TOKEN: ${{ secrets.FABRICA_GH_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/falha-instalacao.md"
          {
            echo '<!-- fabrica:dispatcher -->'
            echo '## O dispatcher não rodou a etapa'
            echo
            echo '**Etapa:** triagem'
            echo '**Motivo:** `sem-resultado` (a instalação do Claude Code ou do plugin falhou, antes de a etapa começar)'
            echo "**Run:** $RUN_URL"
          } > "$body"
          gh issue comment "$ISSUE_NUMBER" --body-file "$body"

      - name: Mostra o log do proxy
        if: always()
        run: sudo cat /etc/fabrica/proxy.log || true
