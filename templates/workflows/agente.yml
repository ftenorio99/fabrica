# Dispatcher da fábrica (SPEC-105, SPEC-106, SPEC-107, ADR 0015 a 0017): a cada
# gesto do usuário na issue ou no PR (label `agente` ou `spec-aprovada`,
# comentário, review, checklist de ação marcada), relê o estado da issue e roda
# as etapas de agente até o próximo portão, no runner, com o plugin instalado e
# o agente isolado (sem rede direta, sem os tokens em claro). Os comentários e
# as labels do próprio agente não passam no filtro do job, então não há
# cascata. Copie este arquivo para .github/workflows/agente.yml do projeto.
# Secrets do repositório:
#   CLAUDE_CODE_OAUTH_TOKEN  claude setup-token
#   FABRICA_GH_TOKEN         fine-grained, só neste repositório (as escritas do job)
#   FABRICA_PLUGIN_TOKEN     fine-grained, só contents: read no ftenorio99/fabrica
# Guia: docs/guias/dispatcher.md do plugin.
name: agente

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

# O grupo usa a mesma expressão do `if` do job: o run de um gesto entra no
# grupo do número da issue ou do PR; o run barrado fica num grupo só dele, para
# não substituir na fila o run pendente de um gesto.
concurrency:
  group: >-
    fabrica-${{ ((github.event_name == 'issues' && github.event.action == 'labeled'
    && github.event.issue.state == 'open'
    && (github.event.label.name == 'agente' || github.event.label.name == 'spec-aprovada'))
    || (github.event_name == 'issue_comment' && github.event.action == 'created'
    && github.event.issue.state == 'open'
    && (github.event.issue.pull_request || contains(github.event.issue.labels.*.name, 'agente'))
    && !startsWith(github.event.comment.body, '<!-- fabrica:'))
    || (github.event_name == 'issue_comment' && github.event.action == 'edited'
    && !github.event.issue.pull_request && github.event.issue.state == 'open'
    && contains(github.event.issue.labels.*.name, 'acao-externa')
    && startsWith(github.event.comment.body, '<!-- fabrica:acao'))
    || (github.event_name == 'pull_request_review' && github.event.action == 'submitted'
    && github.event.pull_request.state == 'open'
    && !startsWith(github.event.review.body, '<!-- fabrica:'))
    || (github.event_name == 'pull_request_review_comment' && github.event.action == 'created'
    && github.event.pull_request.state == 'open'
    && !startsWith(github.event.comment.body, '<!-- fabrica:'))
    ) &&(github.event.issue.number || github.event.pull_request.number)
    || format('ignorado-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  etapa:
    # Filtro anticascata (SPEC-107, seção 1). Mude junto com o grupo acima.
    if: >-
      (github.event_name == 'issues' && github.event.action == 'labeled'
      && github.event.issue.state == 'open'
      && (github.event.label.name == 'agente' || github.event.label.name == 'spec-aprovada'))
      || (github.event_name == 'issue_comment' && github.event.action == 'created'
      && github.event.issue.state == 'open'
      && (github.event.issue.pull_request || contains(github.event.issue.labels.*.name, 'agente'))
      && !startsWith(github.event.comment.body, '<!-- fabrica:'))
      || (github.event_name == 'issue_comment' && github.event.action == 'edited'
      && !github.event.issue.pull_request && github.event.issue.state == 'open'
      && contains(github.event.issue.labels.*.name, 'acao-externa')
      && startsWith(github.event.comment.body, '<!-- fabrica:acao'))
      || (github.event_name == 'pull_request_review' && github.event.action == 'submitted'
      && github.event.pull_request.state == 'open'
      && !startsWith(github.event.review.body, '<!-- fabrica:'))
      || (github.event_name == 'pull_request_review_comment' && github.event.action == 'created'
      && github.event.pull_request.state == 'open'
      && !startsWith(github.event.comment.body, '<!-- fabrica:'))
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Instala o Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Instala o plugin da fábrica
        id: plugin
        env:
          GH_TOKEN: ${{ secrets.FABRICA_PLUGIN_TOKEN }}
          CLAUDE_CODE_PLUGIN_PREFER_HTTPS: "1"
        run: |
          gh auth setup-git
          claude plugin marketplace add ftenorio99/fabrica
          claude plugin install fabrica@fabrica
          path="$(claude plugin list --json | python3 -I -c 'import json, sys; print(next(p["installPath"] for p in json.load(sys.stdin) if p.get("id") == "fabrica@fabrica"))')"
          test -f "$path/scripts/dispatch.sh"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Instala o mitmproxy
        run: |
          sudo python3 -m venv /opt/fabrica-mitm
          sudo /opt/fabrica-mitm/bin/pip install --quiet mitmproxy==12.3.1
          /opt/fabrica-mitm/bin/mitmdump --version

      - name: Prepara o isolamento
        env:
          FABRICA_PLUGIN_DIR: ${{ steps.plugin.outputs.path }}
        run: sudo bash "$FABRICA_PLUGIN_DIR/scripts/job-isolation.sh" prepare "$FABRICA_PLUGIN_DIR" "$GITHUB_WORKSPACE"

      - name: Trava a rede e os segredos
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FABRICA_GH_TOKEN: ${{ secrets.FABRICA_GH_TOKEN }}
          FABRICA_PLUGIN_DIR: ${{ steps.plugin.outputs.path }}
        run: sudo --preserve-env=CLAUDE_CODE_OAUTH_TOKEN,FABRICA_GH_TOKEN bash "$FABRICA_PLUGIN_DIR/scripts/job-isolation.sh" lock

      - name: Roda a etapa
        timeout-minutes: 100
        env:
          GH_TOKEN: ${{ secrets.FABRICA_GH_TOKEN }}
          FABRICA_CLAUDE_BIN: ${{ steps.plugin.outputs.path }}/scripts/run-as-agent.sh
          EVENT_KIND: ${{ (github.event.pull_request || github.event.issue.pull_request) && 'pr' || 'issue' }}
          EVENT_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          FABRICA_PLUGIN_DIR: ${{ steps.plugin.outputs.path }}
        run: bash "$FABRICA_PLUGIN_DIR/scripts/dispatch.sh" run "$EVENT_KIND" "$EVENT_NUMBER"

      - name: Desmarca a issue
        if: always() && steps.plugin.outputs.path != ''
        env:
          GH_TOKEN: ${{ secrets.FABRICA_GH_TOKEN }}
          EVENT_KIND: ${{ (github.event.pull_request || github.event.issue.pull_request) && 'pr' || 'issue' }}
          EVENT_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          FABRICA_PLUGIN_DIR: ${{ steps.plugin.outputs.path }}
        run: bash "$FABRICA_PLUGIN_DIR/scripts/dispatch.sh" unmark "$EVENT_KIND" "$EVENT_NUMBER"

      - name: Publica a falha
        if: failure() && steps.plugin.outputs.path != ''
        env:
          GH_TOKEN: ${{ secrets.FABRICA_GH_TOKEN }}
          EVENT_KIND: ${{ (github.event.pull_request || github.event.issue.pull_request) && 'pr' || 'issue' }}
          EVENT_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          FABRICA_PLUGIN_DIR: ${{ steps.plugin.outputs.path }}
        run: bash "$FABRICA_PLUGIN_DIR/scripts/dispatch.sh" fail "$EVENT_KIND" "$EVENT_NUMBER"

      # Reserva para quando o plugin não chegou a ser instalado: o dispatch.sh
      # vem do plugin, então o comentário sai daqui, com texto fixo.
      - name: Publica a falha da instalação
        if: failure() && steps.plugin.outputs.path == ''
        env:
          GH_TOKEN: ${{ secrets.FABRICA_GH_TOKEN }}
          EVENT_KIND: ${{ (github.event.pull_request || github.event.issue.pull_request) && 'pr' || 'issue' }}
          EVENT_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="$RUNNER_TEMP/falha-instalacao.md"
          {
            echo '<!-- fabrica:dispatcher -->'
            echo '## O dispatcher não rodou a etapa'
            echo
            echo '**Etapa:** não decidida'
            echo '**Motivo:** `sem-resultado` (a instalação do Claude Code ou do plugin falhou, antes de a etapa começar)'
            echo "**Run:** $RUN_URL"
          } > "$body"
          if [ "$EVENT_KIND" = pr ]; then
            gh pr comment "$EVENT_NUMBER" --body-file "$body"
          else
            gh issue comment "$EVENT_NUMBER" --body-file "$body"
          fi

      - name: Mostra o log do proxy
        if: always()
        run: sudo cat /etc/fabrica/proxy.log || true

      # SPEC-107, CA24: o stage.json (etapa, código de saída e saída da etapa)
      # fica como artifact do run para a causa de uma etapa sem publicação
      # aparecer. Não há secret neste passo.
      - name: Guarda o stage.json da execução
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fabrica-stage-${{ github.run_id }}
          path: ${{ runner.temp }}/fabrica-dispatch/stage.json
          retention-days: 3
          if-no-files-found: ignore
